<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel - GitHub Pages Test</title>
  <link rel="manifest" href="/travel/manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    .container { text-align: center; padding: 2rem; }
    h1 { font-size: 3rem; margin-bottom: 0.5rem; }
    p { font-size: 1.2rem; opacity: 0.9; margin-bottom: 1.5rem; }
    .card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 1.5rem 2rem;
      margin: 0.5rem 0;
      min-width: 300px;
    }
    .card h3 { margin-bottom: 0.5rem; font-size: 1rem; opacity: 0.8; }
    .status { font-size: 1.1rem; font-weight: 600; }
    .status.ok { color: #4ade80; }
    .status.fail { color: #f87171; }
    .timestamp { font-size: 0.8rem; opacity: 0.6; margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hello World</h1>
    <p>GitHub Pages is working!</p>

    <div class="card">
      <h3>JavaScript Status</h3>
      <div class="status" id="js-status">⏳ Testing...</div>
    </div>

    <div class="card">
      <h3>PWA Status</h3>
      <div class="status" id="pwa-status">⏳ Testing...</div>
    </div>

    <div class="timestamp">Page loaded at: <span id="load-time"></span></div>
  </div>

  <script src="/travel/js/test.js"></script>
  <script>
    document.getElementById('load-time').textContent = new Date().toLocaleString();
    if (window.travelTest && window.travelTest.test()) {
      document.getElementById('js-status').textContent = '✓ Working';
      document.getElementById('js-status').className = 'status ok';
    } else {
      document.getElementById('js-status').textContent = '✗ Not working';
      document.getElementById('js-status').className = 'status fail';
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/travel/sw.js')
        .then(function(reg) {
          document.getElementById('pwa-status').textContent = '✓ Registered';
          document.getElementById('pwa-status').className = 'status ok';
        })
        .catch(function(err) {
          document.getElementById('pwa-status').textContent = '✗ ' + err.message;
          document.getElementById('pwa-status').className = 'status fail';
        });
    } else {
      document.getElementById('pwa-status').textContent = '✗ Not supported';
      document.getElementById('pwa-status').className = 'status fail';
    }
  </script>
</body>
</html>
